name: hermes-bim-studio
label: Hermes BIM Studio
kind: standalone
version: 0.1.0
author: stupidburgers
license: MIT
homepage: https://github.com/stupidburgers/hermes-bim-studio
description: >
  Local IFC model inspection, wall and slab BaseQuantities reporting, optional
  caller-priced totals for four listed categories only, and an embedded
  interactive 3D viewer. Not a whole-project estimate or compliance certification.
requires_hermes: ">=0.22.0"
python_dependencies:
  - "ifcopenshell>=0.9.0,<0.10"
  - "openpyxl>=3.1.2,<4"
provides_tools:
  - bim_inspect
  - bim_takeoff
  - bim_render_view
provides_hooks: []
