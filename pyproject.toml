[project]
name = "hermes-bim-studio"
version = "0.1.0"
description = "Building Information Modeling (BIM) inspection, 5D quantity takeoff engine, and interactive 3D WebGL viewer for Hermes Agent"
authors = [
  { name = "stupidburgers" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ifcopenshell>=0.9.0",
  "openpyxl>=3.1.2"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
